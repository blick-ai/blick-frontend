name: Create PR to develop

on:
  push:
    branches-ignore:
      - main
      - develop

jobs:
  create_pull_request:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Create Pull Request to develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base develop \
            --head "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --body "PR criado automaticamente pelo GitHub Actions após push na branch \`${{ github.ref_name }}\`." \
            || echo "PR já existe ou não há diferenças, ignorando."