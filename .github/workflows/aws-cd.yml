name: AWS CD

on:
  push:
    branches:
      - develop
      - main
      - feature/deploy

jobs:
  Bootstrap:
    environment:
      name: ${{ github.ref_name == 'feature/deploy' && 'develop' || github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set Region and Stage
        run: |
          echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}" >> $GITHUB_ENV
          if [[ "${{ github.ref_name }}" == "develop" || "${{ github.ref_name }}" == "feature/deploy" ]]; then
            echo "AWS_REGION=sa-east-1" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "AWS_REGION=us-east-1" >> $GITHUB_ENV
          else
            echo "Invalid branch name!" && exit 1
          fi

      - name: Setup AWS Credentials (Bootstrap Role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_BOOTSTRAP_ROLE_ARN }}
          role-session-name: github-action-bootstrap

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install CDK
        run: npm install -g aws-cdk

      - name: CDK Bootstrap
        run: |
          STACK_STATUS=$(aws cloudformation describe-stacks --stack-name CDKToolkitBlkweb --region ${{ env.AWS_REGION }} --query "Stacks[0].StackStatus" --output text 2>&1 || echo "NOT_FOUND")
          if [[ "$STACK_STATUS" == "NOT_FOUND" ]] || [[ "$STACK_STATUS" == *"does not exist"* ]]; then
            echo "Bootstrap nao encontrado, executando..."
            cdk bootstrap aws://${{ env.AWS_ACCOUNT_ID }}/${{ env.AWS_REGION }} --qualifier blkweb --toolkit-stack-name CDKToolkitBlkweb --require-approval never
          else
            echo "Bootstrap ja existe (status: $STACK_STATUS), pulando..."
          fi

  DeployToAWS:
    needs: Bootstrap
    environment:
      name: ${{ github.ref_name == 'feature/deploy' && 'develop' || github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set Region and Stage
        run: |
          echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}" >> $GITHUB_ENV
          if [[ "${{ github.ref_name }}" == "develop" || "${{ github.ref_name }}" == "feature/deploy" ]]; then
            echo "AWS_REGION=sa-east-1" >> $GITHUB_ENV
            echo "STAGE=dev" >> $GITHUB_ENV

          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "AWS_REGION=us-east-1" >> $GITHUB_ENV
            echo "STAGE=prod" >> $GITHUB_ENV

          else
            echo "Invalid branch name!" && exit 1
          fi

      - name: Setup AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-action

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setting stack name
        run: |
          echo "STACK_NAME=BlickWebStackFront${{ env.STAGE }}" >> $GITHUB_ENV

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build
        env:
          VITE_STAGE: ${{ env.STAGE }}

      - name: Install CDK Dependencies
        run: |
          npm install -g aws-cdk
          cd iac
          npm install

      - name: Setup CDK envs
        run: |
          echo AWS_REGION=${{ env.AWS_REGION }} >> $GITHUB_ENV
          echo AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }} >> $GITHUB_ENV
          echo STACK_NAME=${{ env.STACK_NAME }} >> $GITHUB_ENV
          echo GITHUB_REF_NAME=${{ env.STAGE }} >> $GITHUB_ENV

      - name: Deploy with CDK
        run: |
          cd iac
          cdk synth
          cdk deploy --require-approval never

      - name: Get S3 Bucket Name
        run: |
          echo "=== Outputs da stack ==="
          aws cloudformation --region ${{ env.AWS_REGION }} describe-stacks --stack-name ${{ env.STACK_NAME }} --query "Stacks[0].Outputs" --output table
          AWS_BUCKET=$(aws cloudformation --region ${{ env.AWS_REGION }} describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].Outputs[?contains(OutputKey, 'BlickWebBucketName')].OutputValue" \
            --output text)
          echo "AWS_BUCKET=$AWS_BUCKET" >> $GITHUB_ENV

      - name: Upload to S3
        run: |
          aws s3 cp dist s3://${{ env.AWS_BUCKET }}/ --recursive --region ${{ env.AWS_REGION }}

      - name: Get Amplify App ID
        run: |
          AMPLIFY_APP_ID=$(aws cloudformation --region ${{ env.AWS_REGION }} describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].Outputs[?contains(OutputKey, 'BlickWebAmplifyAppId')].OutputValue" \
            --output text)
          echo "AMPLIFY_APP_ID=$AMPLIFY_APP_ID" >> $GITHUB_ENV

      - name: Get Amplify Domain
        run: |
          AMPLIFY_DOMAIN=$(aws cloudformation --region ${{ env.AWS_REGION }} describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].Outputs[?contains(OutputKey, 'BlickWebAmplifyDomain')].OutputValue" \
            --output text)
          echo "AMPLIFY_DOMAIN=$AMPLIFY_DOMAIN" >> $GITHUB_ENV

      - name: Deploy to Amplify
        run: |
          zip -r deploy.zip dist/
          aws amplify create-deployment \
            --app-id ${{ env.AMPLIFY_APP_ID }} \
            --branch-name ${{ env.STAGE == 'prod' && 'main' || 'develop' }} \
            --region ${{ env.AWS_REGION }} > deployment.json
          UPLOAD_URL=$(cat deployment.json | python3 -c "import sys,json; print(json.load(sys.stdin)['zipUploadUrl'])")
          JOB_ID=$(cat deployment.json | python3 -c "import sys,json; print(json.load(sys.stdin)['jobId'])")
          curl -X PUT -H "Content-Type: application/zip" --upload-file deploy.zip "$UPLOAD_URL"
          aws amplify start-deployment \
            --app-id ${{ env.AMPLIFY_APP_ID }} \
            --branch-name ${{ env.STAGE == 'prod' && 'main' || 'develop' }} \
            --job-id $JOB_ID \
            --region ${{ env.AWS_REGION }}